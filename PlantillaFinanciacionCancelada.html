<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="supported-color-schemes" content="light dark" />
  <title>%%TITULO_PESTANA%%</title>
  <!--[if gte mso 9]>
  <xml>
    <o:OfficeDocumentSettings>
      <o:AllowPNG/>
      <o:PixelsPerInch>96</o:PixelsPerInch>
    </o:OfficeDocumentSettings>
  </xml>
  <![endif]-->
  <style type="text/css">
    :root {
      color-scheme: light dark;
      supported-color-schemes: light dark;
    }
    body {
      margin: 0 !important;
      padding: 0 !important;
      background-color: #ffffff !important;
      font-family: Arial, sans-serif;
      color: %%TEXTO_PRINCIPAL%%;
      width: 100% !important;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    }
    table, td {
      mso-table-lspace: 0pt;
      mso-table-rspace: 0pt;
      border-collapse: collapse !important;
      border: 0 !important;
    }
    img {
      -ms-interpolation-mode: bicubic;
      border: 0 !important;
      outline: none !important;
      text-decoration: none !important;
      display: block;
    }
    .no-download {
      cursor: default !important;
      pointer-events: none !important;
      text-decoration: none !important;
      display: block !important;
    }
    /* PREVENCIÓN DE INVERSIÓN FORZADA EN MÓVILES (DARK MODE) */
    @media (prefers-color-scheme: dark) {
      .body-bg { background-color: #ffffff !important; }
      .dark-text-white { color: #ffffff !important; }
    }
  </style>
</head>
<body class="body-bg" style="margin: 0; padding: 0; background-color: #ffffff;">
  <!-- CONTENEDOR PRINCIPAL GENERAL -->
  <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #ffffff; padding: 0; margin: 0; border: 0;">
    <tr>
      <td align="center" style="padding: 0; border: 0;">
        <!-- TABLA ESTRUCTURAL ANCHO 600PX -->
        <table border="0" cellpadding="0" cellspacing="0" width="600" style="background-color: #ffffff; width: 100%; max-width: 600px; margin: 0 auto; border: 0; border-collapse: collapse;">
          <!-- 1. HEADER: LOGOS CORPORATIVOS -->
          <tr>
            <td align="center" style="padding: 20px 0; background-color: #ffffff; border: 0;">
              <table border="0" cellpadding="0" cellspacing="0" align="center" style="border: 0;">
                <tr>
                  <td align="right" valign="middle" style="border: 0;">
                    <a href="javascript:void(0);" onclick="return false;" class="no-download" style="cursor: default; text-decoration: none; display: block;">
                      <img src="%%URL_LOGO_PRIMARIO%%" alt="%%ALT_LOGO_PRIMARIO%%" width="130" style="display: block; width: 130px; max-width: 130px; height: auto; border: 0; cursor: default;" border="0" />
                    </a>
                  </td>
                  <td align="center" valign="middle" style="padding: 0 10px; font-size: 18px; color: %%COLOR_PRIMARIO%%; font-weight: bold; line-height: 1; border: 0;">
                    |
                  </td>
                  <td align="left" valign="middle" style="border: 0;">
                    <a href="javascript:void(0);" onclick="return false;" class="no-download" style="cursor: default; text-decoration: none; display: block;">
                      <img src="%%URL_LOGO_SECUNDARIO%%" alt="%%ALT_LOGO_SECUNDARIO%%" width="130" style="display: block; width: 130px; max-width: 130px; height: auto; border: 0; cursor: default;" border="0" />
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <!-- 2 Y 3. HERO BANNER CON RENGLONES COMPACTADOS -->
          <tr>
            <td align="center" width="600" height="380" background="%%URL_BANNER_HEADER%%" style="background-image: url('%%URL_BANNER_HEADER%%'); background-position: top center; background-repeat: no-repeat; background-size: cover; height: 380px; padding: 0; border: 0; text-align: center; vertical-align: bottom;">
              <!--[if gte mso 9]>
              <v:rect xmlns:v="urn:schemas-microsoft-com:vml" fill="true" stroke="false" style="width:600px;height:350px;">
                <v:fill type="frame" src="%%URL_BANNER_HEADER%%" color="#ffffff" />
                <v:textbox inset="0,0,0,0">
              <![endif]-->
              <div>
                <table border="0" cellpadding="0" cellspacing="0" width="100%" style="border: 0;">
                  <tr>
                    <td align="center" style="padding-top: 180px; padding-bottom: 15px; padding-left: 20px; padding-right: 20px; border: 0;">
                      <!-- TEXTO LEGAL SECUNDARIO -->
                        <div style="font-size: 10px; color: #000000; font-family: Arial, sans-serif; margin-bottom: 4px;">
                        %%TEXTO_SIDEBAR_LEGAL%%
                      </div>
                      <!-- TÍTULO PRINCIPAL SUPERPUESTO -->
                      <span style="font-size: 26px; font-weight: bold; color: #000000; font-style: italic; display: block; font-family: Arial, sans-serif; letter-spacing: 0.5px; line-height: 1.0;">
                        %%HERO_TITULO%%
                      </span>
                      <!-- SUBTÍTULO CON CAJA DE COLOR SUPERPUESTO (ESPACIADO COMPACTO) -->
                      <table border="0" cellpadding="0" cellspacing="0" align="center" style="margin-top: 2px; border: 0;">
                        <tr>
                          <td align="center" bgcolor="%%COLOR_SECUNDARIO%%" style="background-color: #0000B8; padding: 5px 18px; border-radius: 4px; border: 0;">
                            <span style="font-size: 18px; font-weight: bold; color: #ffffff; font-style: italic; font-family: Arial, sans-serif; line-height: 1.0; display: block;">
                              %%HERO_SUBTITULO%%
                            </span>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>
              </div>
              <!--[if gte mso 9]>
                </v:textbox>
              </v:rect>
              <![endif]-->
            </td>
          </tr>
          <!-- 4. CUERPO DE TEXTO Y DATOS -->
          <tr>
            <td style="padding: 20px 45px 20px 45px; background-color: #ffffff; border: 0;">
              <table border="0" cellpadding="0" cellspacing="0" width="100%" style="border: 0;">
                <!-- SALUDO DINÁMICO -->
                <tr>
                  <td align="center" style="font-size: 20px; font-weight: bold; color: #000000; color: %%COLOR_PRIMARIO%%; padding-bottom: 18px; font-family: Arial, sans-serif; border: 0;">
                    %%SALUDO_NOMBRE%%
                  </td>
                </tr>
                <!-- PÁRRAFO 1 -->
                <tr>
                  <td align="center" style="font-size: 13.5px; color: #000000; line-height: 22px; padding-bottom: 20px; font-family: Arial, sans-serif; border: 0;">
                    %%PARRAFO_1%%
                  </td>
                </tr>
                <!-- PÁRRAFO 2 -->
                <tr>
                  <td align="center" style="font-size: 13.5px; color: #000000; line-height: 22px; padding-bottom: 30px; font-family: Arial, sans-serif; border: 0;">
                    %%PARRAFO_2%%
                  </td>
                </tr>
                <!-- BOTÓN DE ACCIÓN (CALL TO ACTION PRINCIPAL) -->
                <tr>
                  <td align="center" style="padding-bottom: 30px; border: 0;">
                    <table border="0" cellpadding="0" cellspacing="0" align="center" style="border: 0;">
                      <tr>
                        <td align="center" bgcolor="%%COLOR_SECUNDARIO%%" style="background-color: #0000B8; border-radius: 25px; border: 0;">
                          <a href="%%URL_BOTON_PAGO%%" target="_blank" style="font-size: 14px; font-family: Arial, sans-serif; color: #ffffff; color: %%COLOR_TEXTO_BOTON%%; font-weight: bold; text-decoration: none; border-radius: 25px; padding: 12px 32px; display: inline-block;">
                            %%TEXTO_BOTON_PAGO%%
                          </a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <!-- PIE / SLOGAN FINAL -->
                <tr>
                  <td align="center" style="padding-top: 10px; padding-bottom: 20px; border: 0;">
                    <table border="0" cellpadding="0" cellspacing="0" align="center" style="border-collapse: collapse; border: 0;">
                      <tr>
                        <td bgcolor="%%COLOR_PRIMARIO%%" style="background-color: #0000B8; padding: 6px 14px; border-top-left-radius: 4px; border-bottom-left-radius: 4px; border: 0;">
                          <span class="dark-text-white" style="font-size: 14px; font-weight: bold; color: #ffffff; font-style: italic; font-family: Arial, sans-serif; display: block; line-height: 1;">
                            %%FOOTER_SLOGAN_PARTE1%%
                          </span>
                        </td>
                        <td bgcolor="#ffffff" style="background-color: #ffffff; padding: 6px 14px 6px 8px; border-top-right-radius: 4px; border-bottom-right-radius: 4px; border: 1px solid #f0f0f0; border-left: none;">
                          <span style="font-size: 14px; font-weight: bold; color: #000000; color: %%COLOR_PRIMARIO%%; font-style: italic; font-family: Arial, sans-serif; display: block; line-height: 1;">
                            %%FOOTER_SLOGAN_PARTE2%%
                          </span>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <!-- MARCA LEGAL / LOGO OFICIAL (PIE DE PÁGINA) -->
                <tr>
                  <td align="center" style="padding-top: 15px; border-top: 1px solid #eeeeee;">
                    <img src="%%URL_ICONO_VIGILADO%%" alt="Entidad Regulada" width="140" style="display: block; width: 140px; max-width: 140px; height: auto; border: 0; outline: none; text-decoration: none; margin: 0 auto;" border="0" />
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td height="20" style="font-size: 0px; line-height: 0px;">&nbsp;</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
